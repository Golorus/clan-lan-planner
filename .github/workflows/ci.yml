# Prüft jeden Pull Request und jeden Stand auf main: Unit-Tests, Typen, End-to-End-Tests (ohne echten Discord-Bot).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit-Tests
        run: npm test
      - name: Typen
        run: npx nuxi typecheck
      - name: End-to-End-Tests
        run: npm run test:e2e
      - name: Log des Test-Servers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: test-out/e2e-dev.log
          if-no-files-found: ignore
